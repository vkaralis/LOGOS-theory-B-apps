name: Synthetic reproduction
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/logos-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python scripts/verify_manifest.py
      - run: python -m unittest discover -s tests -v
      - run: logos-b --output outputs/run1
      - run: logos-b --output outputs/run2
      - run: python scripts/compare_runs.py outputs/run1 outputs/run2
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-results
          path: outputs/run1

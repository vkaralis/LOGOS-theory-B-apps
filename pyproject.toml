[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-theory-b"
version = "0.5.0"
authors = [{name = "Vangelis D. Karalis."}]
description = "LOGOS (Longitudinal Optimization of Global Outcomes and Strategies) — Constrained mathematical optimization of finite-course PK/PD regimens using individual pharmacological models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["logos", "pharmacokinetics", "pharmacodynamics", "pkpd", "dose-optimization", "dosing-regimens", "mathematical-modeling", "computational-pharmacology", "model-informed-precision-dosing", "treatment-optimization", "drug-safety"]
classifiers = ["Programming Language :: Python :: 3.12", "Operating System :: OS Independent"]
dependencies = ["numpy==2.3.5", "scipy==1.17.1", "pandas==2.2.3", "matplotlib==3.10.9"]

[project.scripts]
logos-b = "logos_b.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
